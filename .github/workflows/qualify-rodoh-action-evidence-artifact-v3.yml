name: Qualify exact RODOH action evidence artifact v3

on:
  push:
    branches:
      - qualify/rodoh-action-evidence-artifact-v3
    paths:
      - '.github/workflows/qualify-rodoh-action-evidence-artifact-v3.yml'
      - 'docs/qualification/rodoh-action-evidence-artifact-v3.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  FUNCTIONAL_DONOR: 69b7f9a7bad5b4a94210313ca267a9b479402f09
  GENESIS_KERNEL: 9074e7fb2e9cedde692b248cdd0c6a805e77d8ac

jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RECEIPT_DIR: ${{ runner.temp }}/rodoh-action-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: axm-embodied
          fetch-depth: 0
          show-progress: false

      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-genesis
          ref: ${{ env.GENESIS_KERNEL }}
          path: axm-genesis
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind the exact child and bounded donor-relative diff
        working-directory: axm-embodied
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$FUNCTIONAL_DONOR")" = "$FUNCTIONAL_DONOR"
          mapfile -t changed < <(git diff --name-only "$FUNCTIONAL_DONOR"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/qualify-rodoh-action-evidence-artifact-v3.yml'
          test "${changed[1]}" = 'docs/qualification/rodoh-action-evidence-artifact-v3.md'
          test -z "$(git status --porcelain)"
          mkdir -p "$RECEIPT_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$RECEIPT_DIR/candidate-sha.txt"
          printf '%s\n' "$FUNCTIONAL_DONOR" > "$RECEIPT_DIR/functional-donor-sha.txt"

      - name: Install exact kernel and embodied donor
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install './axm-genesis[mldsa-compat]'
          pip install -e './axm-embodied' --no-deps
          pip install pytest numpy click

      - name: Strict JSON, action-session, and spool transaction custody
        working-directory: axm-embodied
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_strict_action_json.py \
            tests/test_action_session.py \
            tests/test_action_spool.py \
            tests/test_action_evidence_workflow.py \
            2>&1 | tee "$RECEIPT_DIR/focused.log"

      - name: Complete embodied regression and Genesis drift
        shell: bash
        run: |
          set -euo pipefail
          (cd axm-embodied && python -m pytest tests/ -q) 2>&1 | tee "$RECEIPT_DIR/complete.log"
          bash axm-genesis/tools/drift-check.sh axm-embodied 2>&1 | tee "$RECEIPT_DIR/drift.log"
          git -C axm-embodied diff --check
          test -z "$(git -C axm-embodied status --porcelain)"

      - name: Seal exact aggregate qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          root = Path(os.environ['RECEIPT_DIR'])
          receipt = {
              'format': 'axm-embodied-action-evidence-qualification/1',
              'status': 'pass',
              'candidate': os.environ['GITHUB_SHA'],
              'functionalDonor': os.environ['FUNCTIONAL_DONOR'],
              'genesisCommit': os.environ['GENESIS_KERNEL'],
              'python': platform.python_version(),
              'checks': [
                  'bounded-donor-relative-diff',
                  'duplicate-key-refusal',
                  'bounded-json',
                  'session-authority',
                  'candidate-before-receipt',
                  'hash-chain-tamper-refusal',
                  'spool-restart',
                  'sequence-rollback-refusal',
                  'path-escape-refusal',
                  'payload-hash-refusal',
                  'transactional-rollback',
                  'workflow-contract',
                  'complete-regression',
                  'genesis-drift-check',
                  'clean-checkout',
              ],
          }
          (root / 'qualification.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rodoh-action-evidence-custody-v3
          path: ${{ runner.temp }}/rodoh-action-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Publish the retrievable run and artifact ledger to PR 16
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion='${{ job.status }}'
          body=$(cat <<EOF
          Exact action-evidence artifact qualification completed.

          ```text
          conclusion: $conclusion
          run: $GITHUB_RUN_ID
          candidate: $GITHUB_SHA
          functional donor: $FUNCTIONAL_DONOR
          artifact id: ${ARTIFACT_ID:-unavailable}
          artifact digest: ${ARTIFACT_DIGEST:-unavailable}
          artifact url: ${ARTIFACT_URL:-unavailable}
          ```
          EOF
          )
          gh api "repos/$GITHUB_REPOSITORY/issues/16/comments" -f body="$body"
