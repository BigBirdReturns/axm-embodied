name: RODOH action-session custody
# Exact-head qualification trigger for the repaired strict session reader.

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'src/axm_embodied/action_session.py'
      - 'src/axm_embodied/action_session_strict.py'
      - 'tests/test_action_session.py'
      - 'docs/RODOH_ACTION_SESSION_EVIDENCE.md'
      - '.github/workflows/rodoh-action-session.yml'
  push:
    branches:
      - feature/rodoh-action-session-evidence-v1
    paths:
      - '.gitignore'
      - 'src/axm_embodied/action_session.py'
      - 'src/axm_embodied/action_session_strict.py'
      - 'tests/test_action_session.py'
      - 'docs/RODOH_ACTION_SESSION_EVIDENCE.md'
      - '.github/workflows/rodoh-action-session.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rodoh-action-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RECEIPT_DIR: ${{ runner.temp }}/action-session-receipt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact project and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Focused action-session authority and tamper gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          python -m pytest -q tests/test_action_session.py 2>&1 | tee "$RECEIPT_DIR/focused.log"

      - name: Complete embodied regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee "$RECEIPT_DIR/complete.log"
          git diff --check
          test -z "$(git status --porcelain)"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > "$RECEIPT_DIR/candidate-sha.txt"

      - name: Upload action-session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodoh-action-session-custody
          path: ${{ runner.temp }}/action-session-receipt
          if-no-files-found: warn
          retention-days: 30
