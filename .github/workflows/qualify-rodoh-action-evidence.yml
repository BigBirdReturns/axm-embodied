name: Qualify exact RODOH action evidence

on:
  pull_request:
    paths:
      - '.github/workflows/qualify-rodoh-action-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-exact-rodoh-action-evidence
  cancel-in-progress: true

env:
  EXACT_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RECEIPT_DIR: ${{ runner.temp }}/rodoh-action-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_CANDIDATE }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Record exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          test -z "$(git status --porcelain)"
          mkdir -p "$RECEIPT_DIR"
          printf '%s\n' "$EXACT_CANDIDATE" > "$RECEIPT_DIR/candidate-sha.txt"
      - name: Install exact project and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Strict JSON, session authority, spool transaction, and consolidation gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_strict_action_json.py \
            tests/test_action_session.py \
            tests/test_action_spool.py \
            tests/test_action_evidence_workflow.py \
            2>&1 | tee "$RECEIPT_DIR/focused.log"
      - name: Complete embodied regression and clean source proof
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee "$RECEIPT_DIR/complete.log"
          git diff --check
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = {
              "format": "axm-embodied-action-evidence-qualification/1",
              "status": "pass",
              "candidate": os.environ["EXACT_CANDIDATE"],
              "python": os.popen("python --version").read().strip(),
              "checks": [
                  "duplicate-key-refusal",
                  "bounded-json",
                  "session-authority",
                  "candidate-before-receipt",
                  "hash-chain-tamper-refusal",
                  "spool-restart",
                  "sequence-rollback-refusal",
                  "path-escape-refusal",
                  "payload-hash-refusal",
                  "transactional-rollback",
                  "workflow-contract",
                  "complete-regression",
                  "clean-checkout",
              ],
          }
          Path(os.environ["RECEIPT_DIR"], "qualification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-rodoh-action-evidence
          path: ${{ runner.temp }}/rodoh-action-evidence
          if-no-files-found: error
          retention-days: 30
