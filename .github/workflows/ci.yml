# Temporary exact-head qualification child. The permanent donor workflow remains
# .github/workflows/rodoh-action-evidence.yml; this CI variant exists only to
# harvest the same evidence through a workflow already trusted on the base branch.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RECEIPT_DIR: ${{ runner.temp }}/rodoh-action-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: axm-embodied
          fetch-depth: 0
          show-progress: false

      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-genesis
          ref: 9074e7fb2e9cedde692b248cdd0c6a805e77d8ac
          path: axm-genesis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact candidate identity
        working-directory: axm-embodied
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          mkdir -p "$RECEIPT_DIR"
          printf '%s\n' "$expected" > "$RECEIPT_DIR/candidate-sha.txt"

      - name: Install kernel and spoke
        run: |
          python -m pip install --upgrade pip
          pip install './axm-genesis[mldsa-compat]'
          pip install -e './axm-embodied' --no-deps
          pip install pytest numpy click

      - name: Strict JSON, session authority, and spool transaction gate
        working-directory: axm-embodied
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_strict_action_json.py \
            tests/test_action_session.py \
            tests/test_action_spool.py \
            2>&1 | tee "$RECEIPT_DIR/focused.log"

      - name: Complete regression and receipt
        working-directory: axm-embodied
        run: |
          set -euo pipefail
          python -m pytest tests/ -q 2>&1 | tee "$RECEIPT_DIR/complete.log"
          git diff --check
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          candidate = Path(os.environ["RECEIPT_DIR"], "candidate-sha.txt").read_text().strip()
          receipt = {
              "format": "axm-embodied-action-evidence-qualification/1",
              "status": "pass",
              "candidate": candidate,
              "python": platform.python_version(),
              "checks": [
                  "duplicate-key-refusal",
                  "bounded-json",
                  "session-authority",
                  "candidate-before-receipt",
                  "hash-chain-tamper-refusal",
                  "spool-restart",
                  "sequence-rollback-refusal",
                  "path-escape-refusal",
                  "payload-hash-refusal",
                  "transactional-rollback",
                  "complete-regression",
                  "clean-checkout",
              ],
          }
          Path(os.environ["RECEIPT_DIR"], "qualification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Drift check (kernel-boundary lint, sourced from genesis)
        run: bash axm-genesis/tools/drift-check.sh axm-embodied

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rodoh-action-evidence-custody
          path: ${{ runner.temp }}/rodoh-action-evidence
          if-no-files-found: warn
          retention-days: 30
