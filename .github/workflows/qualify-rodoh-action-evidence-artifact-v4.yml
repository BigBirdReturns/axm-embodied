name: Qualify exact RODOH action evidence artifact v4

on:
  push:
    branches:
      - qualify/rodoh-action-evidence-artifact-v3
    paths:
      - '.github/workflows/qualify-rodoh-action-evidence-artifact-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FUNCTIONAL_DONOR: 69b7f9a7bad5b4a94210313ca267a9b479402f09
  GENESIS_KERNEL: 9074e7fb2e9cedde692b248cdd0c6a805e77d8ac

jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RECEIPT_DIR: ${{ runner.temp }}/rodoh-action-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: axm-embodied
          fetch-depth: 0
          show-progress: false

      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-genesis
          ref: ${{ env.GENESIS_KERNEL }}
          path: axm-genesis
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind exact candidate and record the carrier diff
        working-directory: axm-embodied
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD "$FUNCTIONAL_DONOR")" = "$FUNCTIONAL_DONOR"
          mkdir -p "$RECEIPT_DIR"
          git diff --name-only "$FUNCTIONAL_DONOR"...HEAD | tee "$RECEIPT_DIR/carrier-files.txt"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$GITHUB_SHA" > "$RECEIPT_DIR/candidate-sha.txt"
          printf '%s\n' "$FUNCTIONAL_DONOR" > "$RECEIPT_DIR/functional-donor-sha.txt"

      - name: Install exact kernel and embodied donor
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install './axm-genesis[mldsa-compat]'
          pip install -e './axm-embodied' --no-deps
          pip install pytest numpy click

      - name: Strict JSON, action-session, spool, complete regression, and Genesis drift
        id: verify
        shell: bash
        run: |
          set +e
          (
            cd axm-embodied
            python -m pytest -q \
              tests/test_strict_action_json.py \
              tests/test_action_session.py \
              tests/test_action_spool.py \
              tests/test_action_evidence_workflow.py
          ) 2>&1 | tee "$RECEIPT_DIR/focused.log"
          focused=${PIPESTATUS[0]}

          (cd axm-embodied && python -m pytest tests/ -q) 2>&1 | tee "$RECEIPT_DIR/complete.log"
          complete=${PIPESTATUS[0]}

          bash axm-genesis/tools/drift-check.sh axm-embodied 2>&1 | tee "$RECEIPT_DIR/drift.log"
          drift=${PIPESTATUS[0]}

          git -C axm-embodied diff --check 2>&1 | tee "$RECEIPT_DIR/diff-check.log"
          diffcheck=${PIPESTATUS[0]}
          if test -z "$(git -C axm-embodied status --porcelain)"; then clean=0; else clean=1; fi

          printf 'focused=%s\ncomplete=%s\ndrift=%s\ndiffcheck=%s\nclean=%s\n' \
            "$focused" "$complete" "$drift" "$diffcheck" "$clean" | tee "$RECEIPT_DIR/exit-codes.txt"
          if [ "$focused" -ne 0 ] || [ "$complete" -ne 0 ] || [ "$drift" -ne 0 ] || [ "$diffcheck" -ne 0 ] || [ "$clean" -ne 0 ]; then
            echo 'passed=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo 'passed=true' >> "$GITHUB_OUTPUT"

      - name: Seal exact aggregate qualification
        if: steps.verify.outputs.passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          root = Path(os.environ['RECEIPT_DIR'])
          receipt = {
              'format': 'axm-embodied-action-evidence-qualification/1',
              'status': 'pass',
              'candidate': os.environ['GITHUB_SHA'],
              'functionalDonor': os.environ['FUNCTIONAL_DONOR'],
              'genesisCommit': os.environ['GENESIS_KERNEL'],
              'python': platform.python_version(),
              'checks': [
                  'duplicate-key-refusal', 'bounded-json', 'session-authority',
                  'candidate-before-receipt', 'hash-chain-tamper-refusal',
                  'spool-restart', 'sequence-rollback-refusal', 'path-escape-refusal',
                  'payload-hash-refusal', 'transactional-rollback', 'workflow-contract',
                  'complete-regression', 'genesis-drift-check', 'clean-checkout'
              ],
          }
          (root / 'qualification.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY

      - id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodoh-action-evidence-custody-v4
          path: ${{ runner.temp }}/rodoh-action-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Commit the retrievable run and artifact ledger
        if: always()
        working-directory: axm-embodied
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          VERIFY_PASSED: ${{ steps.verify.outputs.passed }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/qualification
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = {
              'format': 'axm-embodied-action-evidence-artifact-ledger/1',
              'status': 'pass' if os.environ.get('VERIFY_PASSED') == 'true' else 'fail',
              'runId': os.environ['GITHUB_RUN_ID'],
              'candidate': os.environ['GITHUB_SHA'],
              'functionalDonor': os.environ['FUNCTIONAL_DONOR'],
              'genesisCommit': os.environ['GENESIS_KERNEL'],
              'artifactId': os.environ.get('ARTIFACT_ID') or None,
              'artifactUrl': os.environ.get('ARTIFACT_URL') or None,
              'artifactDigest': os.environ.get('ARTIFACT_DIGEST') or None,
          }
          Path('docs/qualification/rodoh-action-evidence-artifact-v4-status.json').write_text(
              json.dumps(value, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qualification/rodoh-action-evidence-artifact-v4-status.json
          git commit -m 'Record exact embodied evidence artifact run' || true
          git push origin HEAD:qualify/rodoh-action-evidence-artifact-v3
