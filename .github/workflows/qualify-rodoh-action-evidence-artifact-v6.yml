name: Qualify exact RODOH action evidence artifact v6

on:
  push:
    branches:
      - qualify/rodoh-action-evidence-artifact-v3
    paths:
      - '.github/workflows/qualify-rodoh-action-evidence-artifact-v6.yml'

permissions:
  contents: write

env:
  FUNCTIONAL_DONOR: 69b7f9a7bad5b4a94210313ca267a9b479402f09
  GENESIS_KERNEL: 9074e7fb2e9cedde692b248cdd0c6a805e77d8ac
  RECEIPT_DIR: ${{ runner.temp }}/rodoh-action-evidence

jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualify/rodoh-action-evidence-artifact-v3
          path: axm-embodied
          fetch-depth: 0
          show-progress: false

      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-genesis
          ref: 9074e7fb2e9cedde692b248cdd0c6a805e77d8ac
          path: axm-genesis
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind candidate and install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C axm-embodied merge-base HEAD "$FUNCTIONAL_DONOR")" = "$FUNCTIONAL_DONOR"
          test -z "$(git -C axm-embodied status --porcelain)"
          mkdir -p "$RECEIPT_DIR"
          git -C axm-embodied rev-parse HEAD > "$RECEIPT_DIR/candidate-sha.txt"
          printf '%s\n' "$FUNCTIONAL_DONOR" > "$RECEIPT_DIR/functional-donor-sha.txt"
          git -C axm-embodied diff --name-only "$FUNCTIONAL_DONOR"...HEAD > "$RECEIPT_DIR/carrier-files.txt"
          python -m pip install --upgrade pip
          pip install './axm-genesis[mldsa-compat]'
          pip install -e './axm-embodied' --no-deps
          pip install pytest numpy click

      - name: Run strict action-evidence custody
        working-directory: axm-embodied
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_strict_action_json.py \
            tests/test_action_session.py \
            tests/test_action_spool.py \
            tests/test_action_evidence_workflow.py \
            2>&1 | tee "$RECEIPT_DIR/focused.log"

      - name: Run complete embodied and Genesis gates
        shell: bash
        run: |
          set -euo pipefail
          (cd axm-embodied && python -m pytest tests/ -q) 2>&1 | tee "$RECEIPT_DIR/complete.log"
          bash axm-genesis/tools/drift-check.sh axm-embodied 2>&1 | tee "$RECEIPT_DIR/drift.log"
          git -C axm-embodied diff --check
          test -z "$(git -C axm-embodied status --porcelain)"

      - name: Write aggregate qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          root = Path(os.environ['RECEIPT_DIR'])
          receipt = {
              'format': 'axm-embodied-action-evidence-qualification/1',
              'status': 'pass',
              'candidate': (root / 'candidate-sha.txt').read_text().strip(),
              'functionalDonor': os.environ['FUNCTIONAL_DONOR'],
              'genesisCommit': os.environ['GENESIS_KERNEL'],
              'python': platform.python_version(),
              'checks': [
                  'duplicate-key-refusal',
                  'bounded-json',
                  'session-authority',
                  'candidate-before-receipt',
                  'hash-chain-tamper-refusal',
                  'spool-restart',
                  'sequence-rollback-refusal',
                  'path-escape-refusal',
                  'payload-hash-refusal',
                  'transactional-rollback',
                  'workflow-contract',
                  'complete-regression',
                  'genesis-drift-check',
                  'clean-checkout'
              ]
          }
          (root / 'qualification.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: rodoh-action-evidence-custody-v6
          path: ${{ runner.temp }}/rodoh-action-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Record successful artifact run on the carrier branch
        working-directory: axm-embodied
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/qualification
          printf '{\n  "format": "axm-embodied-action-evidence-artifact-run/1",\n  "status": "pass",\n  "runId": "%s",\n  "candidate": "%s",\n  "functionalDonor": "%s"\n}\n' \
            "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" "$FUNCTIONAL_DONOR" \
            > docs/qualification/rodoh-action-evidence-artifact-v6-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qualification/rodoh-action-evidence-artifact-v6-status.json
          git commit -m 'Record successful embodied evidence artifact run'
          git push origin HEAD:qualify/rodoh-action-evidence-artifact-v3
