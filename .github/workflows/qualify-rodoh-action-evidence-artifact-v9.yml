name: Qualify exact RODOH action evidence artifact v9

on:
  push:
    branches:
      - qualify/rodoh-action-evidence-artifact-v3
    paths:
      - '.github/workflows/qualify-rodoh-action-evidence-artifact-v9.yml'

permissions:
  contents: write

env:
  FUNCTIONAL_DONOR: 69b7f9a7bad5b4a94210313ca267a9b479402f09
  GENESIS_KERNEL: 9074e7fb2e9cedde692b248cdd0c6a805e77d8ac

jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the carrier
        uses: actions/checkout@v4
        with:
          ref: qualify/rodoh-action-evidence-artifact-v3
          path: carrier
          fetch-depth: 0
          show-progress: false

      - name: Publish the started run identity
        working-directory: carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/qualification
          printf '{\n  "format": "axm-embodied-action-evidence-artifact-run/1",\n  "status": "running",\n  "runId": "%s",\n  "carrier": "%s",\n  "candidate": "%s"\n}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$FUNCTIONAL_DONOR" \
            > docs/qualification/rodoh-action-evidence-artifact-v9-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qualification/rodoh-action-evidence-artifact-v9-status.json
          git commit -m 'Record running embodied evidence artifact gate v9'
          git push origin HEAD:qualify/rodoh-action-evidence-artifact-v3

      - name: Check out the exact functional donor
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-embodied
          ref: 69b7f9a7bad5b4a94210313ca267a9b479402f09
          path: axm-embodied
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Check out the exact Genesis kernel
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-genesis
          ref: 9074e7fb2e9cedde692b248cdd0c6a805e77d8ac
          path: axm-genesis
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bind identities and install
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/rodoh-action-evidence"
          test "$(git -C axm-embodied rev-parse HEAD)" = "$FUNCTIONAL_DONOR"
          test "$(git -C axm-genesis rev-parse HEAD)" = "$GENESIS_KERNEL"
          test -z "$(git -C axm-embodied status --porcelain)"
          mkdir -p "$receipt"
          printf '%s\n' "$GITHUB_SHA" > "$receipt/carrier-sha.txt"
          printf '%s\n' "$FUNCTIONAL_DONOR" > "$receipt/candidate-sha.txt"
          printf '%s\n' "$GENESIS_KERNEL" > "$receipt/genesis-sha.txt"
          python -m pip install --upgrade pip
          pip install './axm-genesis[mldsa-compat]'
          pip install -e './axm-embodied' --no-deps
          pip install pytest numpy click

      - name: Focused strict, session, spool, and workflow gate
        working-directory: axm-embodied
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_strict_action_json.py \
            tests/test_action_session.py \
            tests/test_action_spool.py \
            tests/test_action_evidence_workflow.py \
            2>&1 | tee "$RUNNER_TEMP/rodoh-action-evidence/focused.log"

      - name: Complete regression and Genesis drift
        shell: bash
        run: |
          set -euo pipefail
          (cd axm-embodied && python -m pytest tests/ -q) 2>&1 | tee "$RUNNER_TEMP/rodoh-action-evidence/complete.log"
          bash axm-genesis/tools/drift-check.sh axm-embodied 2>&1 | tee "$RUNNER_TEMP/rodoh-action-evidence/drift.log"
          git -C axm-embodied diff --check
          test -z "$(git -C axm-embodied status --porcelain)"

      - name: Write aggregate receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'rodoh-action-evidence'
          value = {
              'format': 'axm-embodied-action-evidence-qualification/1',
              'status': 'pass',
              'candidate': os.environ['FUNCTIONAL_DONOR'],
              'carrier': os.environ['GITHUB_SHA'],
              'genesisCommit': os.environ['GENESIS_KERNEL'],
              'python': platform.python_version(),
              'checks': [
                  'duplicate-key-refusal', 'bounded-json', 'session-authority',
                  'candidate-before-receipt', 'hash-chain-tamper-refusal',
                  'spool-restart', 'sequence-rollback-refusal', 'path-escape-refusal',
                  'payload-hash-refusal', 'transactional-rollback', 'workflow-contract',
                  'complete-regression', 'genesis-drift-check', 'clean-checkout'
              ]
          }
          (root / 'qualification.json').write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload exact custody artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodoh-action-evidence-custody-v9
          path: ${{ runner.temp }}/rodoh-action-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Publish successful completion
        working-directory: carrier
        shell: bash
        run: |
          set -euo pipefail
          printf '{\n  "format": "axm-embodied-action-evidence-artifact-run/1",\n  "status": "pass",\n  "runId": "%s",\n  "carrier": "%s",\n  "candidate": "%s",\n  "genesisCommit": "%s"\n}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$FUNCTIONAL_DONOR" "$GENESIS_KERNEL" \
            > docs/qualification/rodoh-action-evidence-artifact-v9-status.json
          git add docs/qualification/rodoh-action-evidence-artifact-v9-status.json
          git commit -m 'Record successful embodied evidence artifact gate v9'
          git push origin HEAD:qualify/rodoh-action-evidence-artifact-v3
