name: Probe action-evidence branch push

on:
  push:
    branches:
      - qualify/rodoh-action-evidence-artifact-v3
    paths:
      - '.github/workflows/probe-action-evidence-push.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualify/rodoh-action-evidence-artifact-v3
          fetch-depth: 0
      - name: Record that branch-local push workflows execute
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/qualification
          printf '{\n  "format": "axm-embodied-workflow-probe/1",\n  "status": "pass",\n  "runId": "%s",\n  "candidate": "%s"\n}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > docs/qualification/push-workflow-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qualification/push-workflow-probe.json
          git commit -m 'Record branch-local workflow probe'
          git push origin HEAD:qualify/rodoh-action-evidence-artifact-v3
