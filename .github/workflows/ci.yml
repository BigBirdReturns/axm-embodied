# Enforce the kernel boundary: the spoke's tests (which compile a capsule and
# run it through axm-verify, including the embodied@1 continuity check) plus the
# drift-check (kernel-boundary lint, sourced from genesis) run on every push.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EXACT_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RECEIPT_DIR: ${{ runner.temp }}/rodoh-action-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_CANDIDATE }}
          path: axm-embodied
          fetch-depth: 0

      # One genesis checkout serves both roles: the kernel we install and the
      # tree the drift-check is sourced from. Pinned until the kernel is on
      # PyPI; keep in sync with the pin in pyproject.toml.
      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-genesis
          ref: 9074e7fb2e9cedde692b248cdd0c6a805e77d8ac
          path: axm-genesis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact candidate identity
        working-directory: axm-embodied
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          test -z "$(git status --porcelain)"
          mkdir -p "$RECEIPT_DIR"
          printf '%s\n' "$EXACT_CANDIDATE" > "$RECEIPT_DIR/candidate-sha.txt"

      - name: Install kernel and spoke
        run: |
          python -m pip install --upgrade pip
          # Kernel from the checkout above (with the ML-DSA backend).
          pip install './axm-genesis[mldsa-compat]'
          # Editable spoke WITHOUT re-resolving its deps: the git-pinned kernel
          # is already installed from the checkout. Install the third-party
          # runtime/test deps explicitly.
          pip install -e './axm-embodied' --no-deps
          pip install pytest numpy click

      - name: Dedicated strict JSON, session, and spool custody
        working-directory: axm-embodied
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_strict_action_json.py \
            tests/test_action_session.py \
            tests/test_action_spool.py \
            tests/test_action_evidence_workflow.py \
            2>&1 | tee "$RECEIPT_DIR/focused.log"

      - name: Tests (compile -> axm-verify -> embodied@1 continuity)
        working-directory: axm-embodied
        run: python -m pytest tests/ -q 2>&1 | tee "$RECEIPT_DIR/complete.log"

      - name: Drift check (kernel-boundary lint, sourced from genesis)
        run: bash axm-genesis/tools/drift-check.sh axm-embodied 2>&1 | tee "$RECEIPT_DIR/drift.log"

      - name: Seal qualification receipt and clean-checkout proof
        working-directory: axm-embodied
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          receipt = {
              "format": "axm-embodied-action-evidence-qualification/1",
              "status": "pass",
              "candidate": os.environ["EXACT_CANDIDATE"],
              "python": platform.python_version(),
              "genesisCommit": "9074e7fb2e9cedde692b248cdd0c6a805e77d8ac",
              "checks": [
                  "duplicate-key-refusal",
                  "bounded-json",
                  "session-authority",
                  "candidate-before-receipt",
                  "hash-chain-tamper-refusal",
                  "spool-restart",
                  "sequence-rollback-refusal",
                  "path-escape-refusal",
                  "payload-hash-refusal",
                  "transactional-rollback",
                  "workflow-contract",
                  "complete-regression",
                  "genesis-drift-check",
                  "clean-checkout",
              ],
          }
          Path(os.environ["RECEIPT_DIR"], "qualification.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rodoh-action-evidence-custody
          path: ${{ runner.temp }}/rodoh-action-evidence
          if-no-files-found: error
          retention-days: 30
