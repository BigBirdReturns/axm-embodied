name: RODOH action strict JSON boundary

on:
  pull_request:
    paths:
      - 'src/axm_embodied/strict_json.py'
      - 'src/axm_embodied/action_session.py'
      - 'src/axm_embodied/action_session_strict.py'
      - 'src/axm_embodied/action_spool.py'
      - 'src/axm_embodied/action_spool_strict.py'
      - 'tests/test_strict_action_json.py'
      - '.github/workflows/rodoh-action-strict-json.yml'
  push:
    branches:
      - feature/rodoh-action-session-evidence-v1
    paths:
      - 'src/axm_embodied/strict_json.py'
      - 'src/axm_embodied/action_session.py'
      - 'src/axm_embodied/action_session_strict.py'
      - 'src/axm_embodied/action_spool.py'
      - 'src/axm_embodied/action_spool_strict.py'
      - 'tests/test_strict_action_json.py'
      - '.github/workflows/rodoh-action-strict-json.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rodoh-action-strict-json-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact project and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Duplicate-key, resource, authority, and tamper gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p strict-json-receipt
          python -m pytest -q \
            tests/test_strict_action_json.py \
            tests/test_action_session.py \
            tests/test_action_spool.py \
            2>&1 | tee strict-json-receipt/focused.log

      - name: Complete embodied regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee strict-json-receipt/complete.log
          git diff --check
          test -z "$(git status --porcelain)"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > strict-json-receipt/candidate-sha.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rodoh-action-strict-json
          path: strict-json-receipt
          if-no-files-found: warn
          retention-days: 30
